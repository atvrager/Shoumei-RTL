name: Setup verification environment
description: >
  Install the host packages a verification job needs, then configure Bazel with the
  shared action cache and repository cache.  Every job uses this action, so all
  jobs restore the same caches and a later job starts from the work an earlier
  one already did.

inputs:
  packages:
    description: Space-separated apt packages to install
    required: false
    default: ""
  submodules:
    description: Space-separated submodule paths to initialise
    required: false
    default: ""
  lean:
    description: Install the Lean toolchain through elan
    required: false
    default: "false"
  cache-save:
    description: Save the Bazel caches when the job finishes
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install system packages
      if: inputs.packages != ''
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ${{ inputs.packages }}

    # Only the submodules this job needs.  A full recursive checkout pulls ORFS
    # and the RISC-V tool suites into every job, which wastes runner time.
    - name: Initialise submodules
      if: inputs.submodules != ''
      shell: bash
      run: |
        for path in ${{ inputs.submodules }}; do
          git submodule update --init --depth 1 "$path" \
            || git submodule update --init "$path"
        done

    - name: Install Elan (Lean 4)
      if: inputs.lean == 'true'
      shell: bash
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    # disk-cache stores Bazel action outputs, repository-cache stores external
    # repositories.  Bazel keys both caches on the BUILD and MODULE.bazel
    # contents, so every job in every run restores the same caches and only
    # re-runs the actions no earlier job has run.  cache-version busts them.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-version: '1.20.0'
        bazelisk-cache: 'true'
        disk-cache: 'true'
        repository-cache: 'true'
        external-cache: 'true'
        cache-version: '1'
        cache-save: ${{ inputs.cache-save }}
