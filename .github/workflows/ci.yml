name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  presubmit:
    name: Presubmit Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            yosys \
            verilator \
            shellcheck \
            cppcheck \
            python3-pip \
            python3-yaml \
            build-essential
          pip install --break-system-packages pyslang

      - name: Install Elan (Lean 4)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@v0.8.5
        with:
          bazelisk-version: '1.20.0'
          disk-cache: true

      - name: Run Presubmit Test Suite
        run: |
          bazel test //:presubmit

      - name: Build Publication Bundle
        run: |
          bazel build //viewer:pages_bundle

      - name: Upload Pages Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-bundle
          path: bazel-bin/viewer/pages_bundle.tar.gz
          retention-days: 14

  pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-24.04
    needs: [presubmit]
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Pages Bundle Artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-bundle
          path: dist

      - name: Unpack Pages Bundle
        run: |
          mkdir -p pages
          tar -xzf dist/pages_bundle.tar.gz -C pages/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
