name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Decide whether this change touches anything the heavy jobs care about.
      # Deliberately NOT `paths-ignore` on the workflow trigger: that skips the
      # whole run, so required checks never report and the PR can never merge.
      # Gating inside the graph keeps every check reporting (as skipped).
      - name: Detect code changes
        id: detect
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(lean/|testbench/|verification/|physical/|\.github/|Makefile|Generate.*\.lean|lakefile\.lean|lean-toolchain)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed files:"; git diff --name-only "$base"...HEAD | head -20

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          SHELL_SCRIPTS=$(find . -name "*.sh" -type f \
            -not -path "./.git/*" \
            -not -path "./third_party/*")
          if [ -n "$SHELL_SCRIPTS" ]; then
            # shellcheck disable=SC2086
            shellcheck $SHELL_SCRIPTS
          fi

      - name: Python syntax
        run: python3 -m py_compile bootstrap.py

      - name: C/C++ lint (cppcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          CPP_FILES=$(find testbench -name '*.cpp' -o -name '*.h' | grep -v build-sim | grep -v testbench/tests)
          C_FILES=$(find testbench/tests -name '*.c' -o -name '*.h')
          if [ -n "$CPP_FILES" ]; then
            # shellcheck disable=SC2086
            cppcheck --error-exitcode=1 --enable=warning,style \
              --language=c++ \
              --suppress=missingIncludeSystem \
              --suppress=knownConditionTrueFalse \
              --suppress=unusedStructMember \
              --suppress=constParameter \
              --suppress=useStlAlgorithm \
              $CPP_FILES
          fi
          if [ -n "$C_FILES" ]; then
            # shellcheck disable=SC2086
            cppcheck --error-exitcode=1 --enable=warning,style \
              --suppress=missingIncludeSystem \
              --suppress=knownConditionTrueFalse \
              $C_FILES
          fi

      - name: Trailing whitespace
        run: |
          if git grep -I --line-number '\s$' -- '*.lean' '*.md' '*.sh' '*.py' '*.c' '*.cpp' '*.h' '*.S' '*.ld'; then
            echo "Warning: trailing whitespace found (non-blocking)"
          fi

      - name: TODO scan
        run: git grep -n -E 'TODO|FIXME|XXX|HACK' -- '*.lean' '*.c' '*.cpp' '*.h' '*.S' || true

      - name: Documentation exists
        run: |
          test -f README.md
          test -f CLAUDE.md
          test -f GETTING_STARTED.md
          test -f COMMANDS.md
          test -f LICENSE

      # The project map is generated from `lean/` and is part of the review
      # surface, so it must not drift from the source it describes.
      - name: Project map is current
        run: |
          python3 scripts/gen-project-map.py
          git diff --exit-code -- docs/project-map.md

  proof-coverage:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Proof Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run proof coverage analysis
        run: |
          chmod +x verification/proof-coverage.sh
          verification/proof-coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-coverage-report
          path: |
            output/proof-coverage/proof-coverage.md
            output/proof-coverage/proof-coverage.json
          retention-days: 90

  lean-build:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Lean Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
            lake-packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'lean/**/*.lean', 'GenerateAll.lean') }}
          # No restore-keys fallback: stale oleans cause codegen bugs

      - name: Build
        run: lake build

      # `lake build` used to reach only what the library root and the
      # executables import, so a module nothing imported was never compiled and
      # rotted in silence -- nineteen had.  `Shoumei.All` imports every module
      # (generated by scripts/gen-lean-root.py, which omits the ones listed in
      # known-unbuilt-modules.txt because importing them would fail the build).
      #
      # Keeping that root current is what makes the coverage real, so check it
      # rather than trusting it.  known-unbuilt-modules.txt is a ratchet: it may
      # only shrink, and deleting an entry is what fixing a module looks like.
      - name: Lean root is current
        run: python3 scripts/gen-lean-root.py --check

      # Non-default executables have the same problem as unreachable modules:
      # `lake build` does not build them, so they rot unobserved (one had, and
      # is now deleted).
      - name: Every executable target builds
        run: |
          exes=$(sed -n 's/^lean_exe \([A-Za-z0-9_]*\).*/\1/p' lakefile.lean)
          # shellcheck disable=SC2086
          lake build $exes

      - name: Check for sorry
        run: |
          if grep -r "sorry" lean/ --include="*.lean"; then
            echo "Warning: found incomplete proofs (sorry)"
          else
            echo "No incomplete proofs found"
          fi


  shoumei-roundtrip:
    needs: [changes, lean-build]
    if: needs.changes.outputs.code == 'true'
    name: Shoumei Round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
            lake-packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'lean/**/*.lean', 'GenerateAll.lean') }}

      - name: Shoumei round-trip
        run: lake exe generate_shoumei

  codegen:
    name: Code Generation
    runs-on: ubuntu-latest
    needs: [lean-build]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch riscv-opcodes submodule
        run: git submodule update --init third_party/riscv-opcodes

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
            lake-packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'lean/**/*.lean', 'GenerateAll.lean') }}
          # No restore-keys fallback: stale oleans cause codegen bugs

      # NOTE: no `lake clean` here.  The restored .lake cache is keyed on a hash
      # of the Lean sources, toolchain and manifests, so a cache hit is already
      # exactly the right artifacts; wiping it forces a 3-4 minute recompile.
      - name: Generate code
        run: make codegen

      - name: Generate test assembly
        run: lake exe gen_tests

      - name: Upload codegen artifact
        uses: actions/upload-artifact@v4
        with:
          name: codegen-output
          path: |
            output/config.mk
            output/sv-asap7/
            output/sv-from-lean/
            output/sv-netlist/
            output/cpp_sim/
            testbench/generated/
            testbench/tests/generated/
            verification/compositional-certs.txt
          retention-days: 5

      - name: Upload synthesis-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoumei-synth
          path: |
            output/sv-from-lean/
            output/sv-asap7/
            physical/*.sv
            physical/*.f
            physical/constraints.sdc
            physical/config.mk
          retention-days: 30

  verilator-sim:
    name: Verilator Simulation
    runs-on: ubuntu-latest
    needs: [codegen]
    steps:
      - uses: actions/checkout@v4

      - name: Download codegen artifact
        uses: actions/download-artifact@v4
        with:
          name: codegen-output

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Cache RISC-V toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/riscv64-elf
          key: riscv64-elf-2026.01.23

      - name: Setup RISC-V toolchain
        run: |
          ./scripts/setup-riscv-toolchain.sh
          echo "$HOME/.local/riscv64-elf/bin" >> $GITHUB_PATH

      - name: Fetch submodules
        run: |
          git submodule update --init third_party/riscv-tests
          git submodule update --init third_party/FreeRTOS-Kernel

      - name: Build test ELFs
        run: |
          make -C testbench/tests
          make -C testbench/riscv-tests

      - name: Build simulation
        run: make -C testbench sim

      - name: Check Verilator version
        run: verilator --version

      - name: Run all ELF tests
        run: make -C testbench run-all-tests

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: output/test-results.csv
          retention-days: 90

  cppsim:
    name: C++ Simulation
    runs-on: ubuntu-latest
    needs: [codegen]
    steps:
      - uses: actions/checkout@v4

      - name: Download codegen artifact
        uses: actions/download-artifact@v4
        with:
          name: codegen-output

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Build C++ simulation modules
        run: |
          cd cpp_sim
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)
          echo "C++ sim modules compiled successfully (cached CPU uses Verilator for testing)"

  slang-lint:
    name: Slang Lint
    runs-on: ubuntu-latest
    needs: [codegen]
    steps:
      - uses: actions/checkout@v4

      - name: Download codegen artifact
        uses: actions/download-artifact@v4
        with:
          name: codegen-output

      - name: Install pyslang
        run: pip install --break-system-packages pyslang

      - name: Lint Lean-generated SV
        run: python3 verification/slang-lint.py output/sv-from-lean

  cosim:
    name: Cosimulation (RTL vs Spike)
    runs-on: ubuntu-latest
    needs: [codegen]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules
        run: |
          git submodule update --init third_party/riscv-isa-sim
          git submodule update --init third_party/riscv-tests
          git submodule update --init third_party/FreeRTOS-Kernel

      - name: Download codegen artifact
        uses: actions/download-artifact@v4
        with:
          name: codegen-output

      - name: Install Verilator + dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator device-tree-compiler

      - name: Cache Spike
        uses: actions/cache@v4
        with:
          path: ~/.local/spike
          key: spike-rv64-${{ hashFiles('third_party/riscv-isa-sim/**') }}
          restore-keys: |
            spike-rv64-

      - name: Build Spike
        run: |
          if [ ! -f "$HOME/.local/spike/lib/libriscv.a" ] && [ ! -f "$HOME/.local/spike/lib/libriscv.so" ]; then
            chmod +x scripts/build-spike.sh
            scripts/build-spike.sh
          fi

      - name: Cache RISC-V toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/riscv64-elf
          key: riscv64-elf-2026.01.23

      - name: Setup RISC-V toolchain
        run: |
          ./scripts/setup-riscv-toolchain.sh
          echo "$HOME/.local/riscv64-elf/bin" >> $GITHUB_PATH

      - name: Build test ELFs
        run: |
          make -C testbench/tests
          make -C testbench/riscv-tests

      - name: Build cosim (RTL + Spike)
        run: make -C testbench cosim

      - name: Run cosim
        run: make -C testbench run-cosim

      - name: Upload cosim results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosim-results
          path: output/cosim-results.csv
          retention-days: 90
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [codegen]
    steps:
      - uses: actions/checkout@v4

      - name: Download codegen artifact
        uses: actions/download-artifact@v4
        with:
          name: codegen-output

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      - name: Run smoke tests
        run: |
          chmod +x verification/smoke-test.sh
          ./verification/smoke-test.sh

  ci-pass:
    name: CI Pass
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, proof-coverage, verilator-sim, cppsim, slang-lint, cosim, smoke-test]
    steps:
      - name: Check all jobs passed
        run: |
          results=( \
            "${{ needs.lint.result }}" \
            "${{ needs.proof-coverage.result }}" \
            "${{ needs.verilator-sim.result }}" \
            "${{ needs.cppsim.result }}" \
            "${{ needs.slang-lint.result }}" \
            "${{ needs.cosim.result }}" \
            "${{ needs.smoke-test.result }}" \
          )
          for r in "${results[@]}"; do
            case "$r" in
              success|skipped) ;;  # skipped = gated out by Change Detection
              *)
                echo "One or more jobs failed or were cancelled: $r"
                exit 1
                ;;
            esac
          done
          echo "All required leaf jobs passed (or were skipped for a docs-only change)"
