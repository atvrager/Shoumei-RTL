name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Decide whether this change touches anything the heavy jobs care about.
      # Deliberately NOT `paths-ignore` on the workflow trigger: that skips the
      # whole run, so required checks never report and the PR can never merge.
      # Gating inside the graph keeps every check reporting (as skipped).
      - name: Detect code changes
        id: detect
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          # Granular gating: heavy jobs run only when the paths they depend
          # on change. Unknown paths default to `rtl` so build-relevant
          # renames can never skip validation.
          #
          #   .github/ docs/ *.md images -> nothing (files still linted)
          #   scripts/                   -> codegen (treemap freshness check)
          #   testbench/ verification/   -> sims (no synthesis)
          #   physical/                  -> synthesis (no sims)
          #   lean/ Makefile others      -> rtl (everything)
          files="$(git diff --name-only "$base"...HEAD)"
          rtl=false; sim=false; synth=false; scripts=false
          if [ -n "$files" ]; then
            while IFS= read -r f; do
              case "$f" in
                lean/*|Generate*.lean|lakefile*.lean|lake-manifest.json|lean-toolchain|Makefile) rtl=true ;;
                testbench/*|verification/*) sim=true ;;
                physical/*) synth=true ;;
                scripts/*) scripts=true ;;
                .github/*|docs/*|*.md|*.png|*.svg|LICENSE|.gitignore) ;;
                *) rtl=true ;;
              esac
            done <<< "$files"
          fi

          code=false
          [ "$rtl" = true ] && code=true
          [ "$sim" = true ] && code=true
          [ "$synth" = true ] && code=true
          [ "$scripts" = true ] && code=true

          echo "rtl=$rtl" >> "$GITHUB_OUTPUT"
          echo "sim=$sim" >> "$GITHUB_OUTPUT"
          echo "synth=$synth" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files:"; echo "$files" | head -20

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck
        run: |
          SHELL_SCRIPTS=$(find . -name "*.sh" -type f \
            -not -path "./.git/*" \
            -not -path "./third_party/*")
          if [ -n "$SHELL_SCRIPTS" ]; then
            # shellcheck disable=SC2086
            shellcheck $SHELL_SCRIPTS
          fi

      - name: Python syntax
        run: |
          python3 -m py_compile bootstrap.py
          python3 -m py_compile scripts/*.py
          python3 -m py_compile verification/*.py

      # CI-only changes no longer trigger the heavy pipeline, so at least
      # validate the workflow files themselves on every run.
      - name: Workflow YAML parse
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import pathlib, sys, yaml
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text())
              except Exception as e:
                  print(f"{p}: {e}", file=sys.stderr)
                  sys.exit(1)
          print("workflow YAML OK")
          EOF

      - name: C/C++ lint (cppcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          CPP_FILES=$(find testbench -name '*.cpp' -o -name '*.h' | grep -v build-sim | grep -v testbench/tests)
          C_FILES=$(find testbench/tests -name '*.c' -o -name '*.h')
          if [ -n "$CPP_FILES" ]; then
            # shellcheck disable=SC2086
            cppcheck --error-exitcode=1 --enable=warning,style \
              --language=c++ \
              --suppress=missingIncludeSystem \
              --suppress=knownConditionTrueFalse \
              --suppress=unusedStructMember \
              --suppress=constParameter \
              --suppress=useStlAlgorithm \
              $CPP_FILES
          fi
          if [ -n "$C_FILES" ]; then
            # shellcheck disable=SC2086
            cppcheck --error-exitcode=1 --enable=warning,style \
              --suppress=missingIncludeSystem \
              --suppress=knownConditionTrueFalse \
              $C_FILES
          fi

      - name: Trailing whitespace
        run: |
          if git grep -I --line-number '\s$' -- '*.lean' '*.md' '*.sh' '*.py' '*.c' '*.cpp' '*.h' '*.S' '*.ld'; then
            echo "Warning: trailing whitespace found (non-blocking)"
          fi

      - name: TODO scan
        run: git grep -n -E 'TODO|FIXME|XXX|HACK' -- '*.lean' '*.c' '*.cpp' '*.h' '*.S' || true

      - name: Documentation exists
        run: |
          test -f README.md
          test -f CLAUDE.md
          test -f docs/getting-started.md
          test -f docs/commands.md
          test -f LICENSE

      # The project map is generated from `lean/` and is part of the review
      # surface, so it must not drift from the source it describes.
      - name: Project map is current
        run: |
          python3 scripts/gen-project-map.py
          git diff --exit-code -- docs/project-map.md

  proof-coverage:
    needs: [changes, lean-build]
    if: needs.changes.outputs.rtl == 'true'
    name: Proof Coverage & Depth Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v6
        with:
          path: |
            .lake
            lake-packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'lean/**/*.lean', 'GenerateAll.lean') }}

      - name: Run proof coverage and depth hierarchy analysis
        run: |
          chmod +x verification/proof-coverage.sh
          verification/proof-coverage.sh

      - name: Run hardware mutation testing suite
        run: |
          chmod +x verification/mutation-test.sh
          verification/mutation-test.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: proof-coverage-report
          path: |
            output/proof-coverage/proof-coverage.md
            output/proof-coverage/proof-coverage.json
            output/proof-manifest.json
            output/mutation-test/mutation-report.json
          retention-days: 90

  lean-build:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Lean Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v6
        with:
          path: |
            .lake
            lake-packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'lean/**/*.lean', 'GenerateAll.lean') }}
          # No restore-keys fallback: stale oleans cause codegen bugs

      - name: Build
        run: lake build

      # `lake build` used to reach only what the library root and the
      # executables import, so a module nothing imported was never compiled and
      # rotted in silence -- nineteen had.  `Shoumei.All` imports every module
      # (generated by scripts/gen-lean-root.py, which omits the ones listed in
      # known-unbuilt-modules.txt because importing them would fail the build).
      #
      # Keeping that root current is what makes the coverage real, so check it
      # rather than trusting it.  known-unbuilt-modules.txt is a ratchet: it may
      # only shrink, and deleting an entry is what fixing a module looks like.
      - name: Lean root is current
        run: python3 scripts/gen-lean-root.py --check

      # Non-default executables have the same problem as unreachable modules:
      # `lake build` does not build them, so they rot unobserved (one had, and
      # is now deleted).
      - name: Every executable target builds
        run: |
          exes=$(sed -n 's/^lean_exe \([A-Za-z0-9_]*\).*/\1/p' lakefile.lean)
          # shellcheck disable=SC2086
          lake build $exes

      - name: Check for sorry
        run: |
          if grep -r "sorry" lean/ --include="*.lean"; then
            echo "Warning: found incomplete proofs (sorry)"
          else
            echo "No incomplete proofs found"
          fi


  shoumei-roundtrip:
    needs: [changes, lean-build]
    if: needs.changes.outputs.rtl == 'true'
    name: Shoumei Round-trip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v6
        with:
          path: |
            .lake
            lake-packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'lean/**/*.lean', 'GenerateAll.lean') }}

      - name: Shoumei round-trip
        run: lake exe generate_shoumei

  codegen:
    name: Code Generation
    runs-on: ubuntu-24.04
    needs: [lean-build]
    steps:
      - uses: actions/checkout@v5

      - name: Fetch riscv-opcodes submodule
        run: git submodule update --init third_party/riscv-opcodes

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v6
        with:
          path: |
            .lake
            lake-packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'lean/**/*.lean', 'GenerateAll.lean') }}
          # No restore-keys fallback: stale oleans cause codegen bugs

      # NOTE: no `lake clean` here.  The restored .lake cache is keyed on a hash
      # of the Lean sources, toolchain and manifests, so a cache hit is already
      # exactly the right artifacts; wiping it forces a 3-4 minute recompile.
      - name: Generate code
        run: make codegen

      - name: Generate test assembly
        run: lake exe gen_tests

      - name: Generate architecture diagram
        run: |
          pip install --quiet matplotlib==3.11.2
          make architecture-diagram

      # The treemap is generated from emitted SV and embedded in the README,
      # so the committed PNG must not drift from the Lean sources (same rule
      # as docs/project-map.md in the lint job).
      - name: Treemap is current
        run: git diff --exit-code -- docs/architecture-treemap.png

      - name: Treemap summary
        run: |
          if [ -f output/architecture-treemap.svg ]; then
            echo "### Microarchitecture Gate Treemap" >> $GITHUB_STEP_SUMMARY
            echo "Generated XKCD-style microarchitecture treemap (\`output/architecture-treemap.svg\` and \`output/architecture-treemap.png\`)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload architecture diagram
        uses: actions/upload-artifact@v6
        with:
          name: architecture-treemap
          path: |
            output/architecture-treemap.svg
            output/architecture-treemap.png
          retention-days: 30

      - name: Upload codegen artifact
        uses: actions/upload-artifact@v6
        with:
          name: codegen-output
          path: |
            output/config.mk
            output/sv-asap7/
            output/sv-from-lean/
            output/sv-netlist/
            output/cpp_sim/
            output/architecture-treemap.svg
            output/architecture-treemap.png
            testbench/generated/
            testbench/tests/generated/
            verification/compositional-certs.txt
          retention-days: 5

      - name: Upload synthesis-ready artifact
        uses: actions/upload-artifact@v6
        with:
          name: shoumei-synth
          path: |
            output/sv-from-lean/
            output/sv-asap7/
            physical/*.sv
            physical/*.f
            physical/constraints.sdc
            physical/config.mk
          retention-days: 30

  # Publication job: rebuilds everything from main and deploys the
  # visualization suite (treemaps, sunbursts, gate cities, pipeline-traces
  # viewer) to GitHub Pages (free, public repo). Deliberately NOT in
  # ci-pass: publishing is not validation.
  visuals:
    name: Visuals & Pages
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v6
        with:
          path: |
            .lake
            lake-packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'lean/**/*.lean', 'GenerateAll.lean') }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate code
        run: |
          pip install --quiet matplotlib==3.11.2
          make codegen

      - name: Setup OSS CAD Suite (Yosys)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build visualization suite
        run: ./scripts/build-visuals.sh

      - name: Upload visualization suite
        uses: actions/upload-artifact@v6
        with:
          name: visuals-pages
          path: output/architecture-visuals/
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/architecture-visuals/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # PR-side verification of the visualization pipeline (no publish): script or
  # synthesis-flow breakage surfaces on the PR, not on merge.
  visuals-check:
    name: Visuals Check
    runs-on: ubuntu-24.04
    needs: [changes, codegen]
    if: needs.changes.outputs.rtl == 'true' || needs.changes.outputs.synth == 'true' || needs.changes.outputs.scripts == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download codegen artifact
        uses: actions/download-artifact@v7
        with:
          name: codegen-output

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup OSS CAD Suite (Yosys)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build visualization suite
        run: |
          pip install --quiet matplotlib==3.11.2
          ./scripts/build-visuals.sh

      - name: Upload visualization suite
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visuals-check
          path: output/architecture-visuals/
          retention-days: 14

  verilator-sim:
    name: Verilator Simulation
    runs-on: ubuntu-24.04
    needs: [changes, codegen]
    if: needs.changes.outputs.rtl == 'true' || needs.changes.outputs.sim == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Download codegen artifact
        uses: actions/download-artifact@v7
        with:
          name: codegen-output

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Cache RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: ~/.local/riscv64-elf
          key: riscv64-elf-2026.01.23

      - name: Setup RISC-V toolchain
        run: |
          ./scripts/setup-riscv-toolchain.sh
          echo "$HOME/.local/riscv64-elf/bin" >> $GITHUB_PATH

      - name: Fetch submodules
        run: |
          git submodule update --init third_party/riscv-tests
          git submodule update --init third_party/FreeRTOS-Kernel

      - name: Build test ELFs
        run: |
          make -C testbench/tests
          make -C testbench/riscv-tests

      - name: Build simulation
        run: make -C testbench sim

      - name: Check Verilator version
        run: verilator --version

      - name: Run all ELF tests
        run: make -C testbench run-all-tests

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: output/test-results.csv
          retention-days: 90

  cppsim:
    name: C++ Simulation
    runs-on: ubuntu-24.04
    needs: [changes, codegen]
    if: needs.changes.outputs.rtl == 'true' || needs.changes.outputs.sim == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Download codegen artifact
        uses: actions/download-artifact@v7
        with:
          name: codegen-output

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Build C++ simulation modules
        run: |
          cd cpp_sim
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)
          echo "C++ sim modules compiled successfully (cached CPU uses Verilator for testing)"

  slang-lint:
    name: Slang Lint
    runs-on: ubuntu-24.04
    needs: [changes, codegen]
    if: needs.changes.outputs.rtl == 'true' || needs.changes.outputs.sim == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Download codegen artifact
        uses: actions/download-artifact@v7
        with:
          name: codegen-output

      - name: Install pyslang
        run: pip install --break-system-packages pyslang

      - name: Lint Lean-generated SV
        run: python3 verification/slang-lint.py output/sv-from-lean

  cosim:
    name: Cosimulation (RTL vs Spike)
    runs-on: ubuntu-24.04
    needs: [changes, codegen]
    if: needs.changes.outputs.rtl == 'true' || needs.changes.outputs.sim == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Fetch submodules
        run: |
          git submodule update --init third_party/riscv-isa-sim
          git submodule update --init third_party/riscv-tests
          git submodule update --init third_party/FreeRTOS-Kernel

      - name: Download codegen artifact
        uses: actions/download-artifact@v7
        with:
          name: codegen-output

      - name: Install Verilator + dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator device-tree-compiler

      - name: Cache Spike
        uses: actions/cache@v6
        with:
          path: ~/.local/spike
          key: spike-rv64-${{ hashFiles('third_party/riscv-isa-sim/**') }}
          restore-keys: |
            spike-rv64-

      - name: Build Spike
        run: |
          if [ ! -f "$HOME/.local/spike/lib/libriscv.a" ] && [ ! -f "$HOME/.local/spike/lib/libriscv.so" ]; then
            chmod +x scripts/build-spike.sh
            scripts/build-spike.sh
          fi

      - name: Cache RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: ~/.local/riscv64-elf
          key: riscv64-elf-2026.01.23

      - name: Setup RISC-V toolchain
        run: |
          ./scripts/setup-riscv-toolchain.sh
          echo "$HOME/.local/riscv64-elf/bin" >> $GITHUB_PATH

      - name: Build test ELFs
        run: |
          make -C testbench/tests
          make -C testbench/riscv-tests

      - name: Build cosim (RTL + Spike)
        run: make -C testbench cosim

      - name: Run cosim
        run: make -C testbench run-cosim

      - name: Upload cosim results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cosim-results
          path: output/cosim-results.csv
          retention-days: 90
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-24.04
    needs: [changes, codegen]
    if: needs.changes.outputs.rtl == 'true' || needs.changes.outputs.sim == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Download codegen artifact
        uses: actions/download-artifact@v7
        with:
          name: codegen-output

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      - name: Run smoke tests
        run: |
          chmod +x verification/smoke-test.sh
          ./verification/smoke-test.sh

  open-source-synthesis:
    needs: [codegen]
    if: needs.changes.outputs.rtl == 'true' || needs.changes.outputs.synth == 'true'
    name: Synthesis (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: gf180
            name: GF180MCU 64MHz
            script: ./physical/run-yosys-gf180.sh
            out_dir: syn_out_gf180
          - platform: asap7
            name: ASAP7 1.0GHz
            script: ./physical/run-yosys-asap7.sh
            out_dir: syn_out_asap7
    steps:
      - uses: actions/checkout@v5

      - name: Download codegen artifact
        uses: actions/download-artifact@v7
        with:
          name: codegen-output

      - name: Fetch ORFS submodule
        run: |
          git submodule update --init --depth 1 third_party/orfs

      - name: Setup OSS CAD Suite (Yosys)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synthesize RV64 (${{ matrix.name }})
        run: |
          time ${{ matrix.script }}

      - name: Upload synthesis artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: synthesis-artifacts-${{ matrix.platform }}
          path: |
            ${{ matrix.out_dir }}/netlist/
            ${{ matrix.out_dir }}/reports/
            ${{ matrix.out_dir }}/synth.log
            ${{ matrix.out_dir }}/abc.constr
          retention-days: 14

  ci-pass:
    name: CI Pass
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - changes
      - lint
      - lean-build
      - proof-coverage
      - shoumei-roundtrip
      - codegen
      - visuals-check
      - verilator-sim
      - cppsim
      - slang-lint
      - cosim
      - smoke-test
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection job did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint job did not succeed: ${{ needs.lint.result }}"
            exit 1
          fi

          code_changed="${{ needs.changes.outputs.code }}"
          echo "Code changed: $code_changed"

          code_jobs=( \
            "lean-build:${{ needs.lean-build.result }}" \
            "proof-coverage:${{ needs.proof-coverage.result }}" \
            "shoumei-roundtrip:${{ needs.shoumei-roundtrip.result }}" \
            "codegen:${{ needs.codegen.result }}" \
            "visuals-check:${{ needs.visuals-check.result }}" \
            "verilator-sim:${{ needs.verilator-sim.result }}" \
            "cppsim:${{ needs.cppsim.result }}" \
            "slang-lint:${{ needs.slang-lint.result }}" \
            "cosim:${{ needs.cosim.result }}" \
            "smoke-test:${{ needs.smoke-test.result }}" \
          )

          failed=0
          for entry in "${code_jobs[@]}"; do
            job="${entry%%:*}"
            result="${entry##*:}"
            if [ "$code_changed" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "Required job '$job' did not succeed: $result (expected: success)"
                failed=1
              fi
            else
              if [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
                echo "Job '$job' failed or was cancelled: $result"
                failed=1
              fi
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "CI validation failed: one or more required jobs did not succeed"
            exit 1
          fi
          echo "All required jobs passed (or were skipped for a docs-only change)"
