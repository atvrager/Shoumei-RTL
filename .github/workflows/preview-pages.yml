name: Preview Pages

on:
  workflow_dispatch:

jobs:
  preview:
    name: Preview & Deploy
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          packages: build-essential
          submodules: third_party/riscv-opcodes
          lean: 'true'
          cache-save: 'false'

      - name: Build Publication Bundle
        run: |
          bazel build //viewer:pages_bundle

      - name: Unpack Pages Bundle
        run: |
          mkdir -p pages
          tar -xzf bazel-bin/viewer/pages_bundle.tar.gz -C pages/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4