<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoumei pipeline viewer</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #0f1318; color: #c8cdd3; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #232a32; font-size: 13px; flex-wrap: wrap; }
  #bar b { color: #fff; }
  #status { color: #8ab4ff; font-size: 12px; }
  #filter { background: #141a21; color: #c8cdd3; border: 1px solid #2a3038; border-radius: 6px; padding: 4px 8px; width: 220px; outline: none; }
  #filter:focus { border-color: #4a5568; }
  button { background: #1d2530; color: #c8cdd3; border: 1px solid #2a3038; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #26313f; }
  #wrap { position: relative; height: calc(100% - 42px); }
  canvas { display: block; width: 100%; height: 100%; }
  #tooltip { position: absolute; z-index: 20; display: none; background: rgba(12,16,20,.92); border: 1px solid #3a4450;
             border-radius: 6px; padding: 6px 10px; font-size: 12px; pointer-events: none; max-width: 340px; line-height: 1.45; }
  #tooltip b { color: #fff; }
  #details { position: absolute; right: 12px; top: 12px; z-index: 10; display: none; background: rgba(12,16,20,.92);
             border: 1px solid #2a3038; border-radius: 8px; padding: 10px 14px; font-size: 12px; max-width: 340px; line-height: 1.5; }
  #details b { color: #fff; }
  #details i { color: #9aa4b0; }
</style>
</head>
<body>
<div id="bar">
  <b>Shoumei pipeline traces</b>
  <span><input id="filter" type="text" placeholder="filter by label / pc..."></span>
  <span><button id="zoom-in" title="zoom in">+</button> <button id="zoom-out" title="zoom out">−</button> <button id="reset" title="fit trace">fit</button></span>
  <span><input id="file" type="file" accept=".txt"></span>
  <span id="status"></span>
</div>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="tooltip"></div>
  <div id="details"></div>
</div>
<script type="module" src="./dist/viewer.js"></script>
</body>
</html>
